groups:
  core_build_tools:
    - cmake
    - ninja-build
    - git
    - git-lfs
    - clang
    - g++
    - sudo
    - ssh

  system_utilities:
    - tree
    - ne
    - chrpath
    - rsync
    - gdb

  python_stack:
    - python3
    - python3-dev
    - python3-setuptools
    - python3-sympy
    - python3-pytest
    - python3-gmsh
    - python3-plotly
    - python3-sklearn-pandas
    - python3-tqdm
    - python3-h5py
    - python3-mpi4py
    - python3-numpy
    - python3-petsc4py
    - python3-petsc4py-real
    - python3-slepc4py
    - python3-slepc4py-real
    - python3-venv
    - python3-pymongo
    - dh-python
    - pybind11-dev
    - pybind11-json-dev

  boost_libraries:
    - libboost-all-dev

  math_libraries:
    - libcln-dev
    - libmetis-dev
    - libscotch-dev
    - libeigen3-dev
    - libgsl-dev
    - libnlopt-dev
    - libann-dev
    - libglpk-dev

  petsc_slepc:
    - petsc-dev
    - slepc-dev

  hdf5_netcdf:
    - libhdf5-openmpi-dev
    - libnetcdf-dev
    - libfftw3-mpi-dev

  geometry_mesh:
    - libgmsh-dev
    - gmsh
    - libgl2ps-dev
    - libglu1-mesa-dev
    - libsm-dev
    - libxt-dev

  xml_parsers:
    - libxml2-dev
    - libpugixml-dev

  build_deps:
    - bison
    - flex
    - libtbb-dev
    - libbz2-dev
    - libzip-dev

  database_clients:
    - libbson-dev
    - libmongoc-dev
    - libmongo-client-dev

  documentation:
    - doxygen
    - transfig
    - imagemagick
    - ruby-progressbar
    - ruby-tilt
    - asciidoctor
    - ruby-asciidoctor-pdf
    - ruby
    - ruby-dev

  graphics_opengl:
    - libglew-dev

  containers_tools:
    - docker.io
    - jsonlint

  misc_tools:
    - man
    - jq
    - curl

  debian_packaging:
    - quilt
    - debhelper

layers:
  base:
    - core_build_tools
    - system_utilities

  python:
    - python_stack

  math:
    - boost_libraries
    - math_libraries
    - petsc_slepc
    - hdf5_netcdf

  geometry:
    - geometry_mesh
    - xml_parsers

  build:
    - build_deps
    - documentation

  feelpp:
    - database_clients
    - graphics_opengl
    - containers_tools
    - misc_tools
    - debian_packaging
