# Supported shared Feel++ CPU/OpenMPI environment pinned to PETSc 3.22.
#
# This manifest mirrors the main `cpu/openmpi/` environment while using the
# PETSc/SLEPc 3.22 line to match the Debian Trixie solver stack more closely.
spack:
  config:
    installer: new
    build_jobs: 16
    concurrent_packages: 2
  packages:
    mpi:
      require:
      - "openmpi@:4.1 fabrics=cma,ucx"
    mesa:
      require:
      - "~llvm"

  specs:
  - "openmpi fabrics=cma,ucx ^ucx~rocm+cma+thread_multiple"
  - "cmake"
  - "ninja"
  - "bison"
  - "flex"
  - "rsync"
  - "boost+regex+date_time+filesystem+iostreams+mpi+multithreaded+program_options+serialization+shared+system+test"
  - "fmt+shared cxxstd=20"
  - "curl"
  - "libzip"
  - "pugixml"
  - "hwloc"
  - "cln"
  - "ginac"
  - "eigen"
  - "gmsh@4.13.1 +opencascade+mmg~fltk"
  - "py-gmsh@4.13.1"
  - "py-pybind11"
  - "py-mpi4py"
  - "py-petsc4py@3.22.5"
  - "py-slepc4py@3.22.2"
  - "py-sympy"
  - "py-pytest"
  - "petsc@3.22.5+hpddm+mumps+hwloc+ptscotch+suite-sparse+hdf5+hypre"
  - "slepc@3.22.2+hpddm"

  view: $user_cache_path/views/feelpp/cpu-openmpi-petsc-322

  concretizer:
    unify: when_possible

  repos:
    feelpp: ${FEELPP_REPO_ROOT}/packaging/spack/repo/spack_repo/feelpp
