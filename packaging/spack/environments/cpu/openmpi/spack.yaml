# Supported shared Feel++ CPU/OpenMPI environment.
#
# This manifest is the baseline package derived from the legacy
# `openmpi4/` bootstrap environment. It focuses on the 
# PETSc/HPDDM-enabled workflow and intentionally avoids embedding site-local
# compiler externals, local mirrors, or unrelated optional packages.
spack:
  config:
    installer: new
    build_jobs: 16
    concurrent_packages: 2
  packages:
    mpi:
      require:
      - "openmpi@:4.1 fabrics=cma,ucx"
    mesa:
      require:
      - "~llvm"

  specs:
  - "openmpi fabrics=cma,ucx ^ucx~rocm+cma+thread_multiple"
  - "cmake"
  - "ninja"
  - "bison"
  - "flex"
  - "rsync"
  - "boost+regex+date_time+filesystem+iostreams+mpi+multithreaded+program_options+serialization+shared+system+test"
  - "fmt+shared cxxstd=20"
  - "curl"
  - "libzip"
  - "pugixml"
  - "hwloc"
  - "cln"
  - "ginac"
  - "eigen"
  # Feel++ needs the Gmsh library and CLI, not the FLTK GUI. Keep the
  # environment headless to avoid the extra GUI/OpenGL stack in Docker/CI.
  # Pin 4.13.1 for now: the bundled Spack v1.0.0 builtin package selects
  # newer 4.15.x, which is not yet validated in this shared environment.
  - "gmsh@4.13.1 +opencascade+mmg~fltk"
  - "py-pybind11"
  - "py-mpi4py"
  - "py-petsc4py@3.25.0"
  - "py-slepc4py@3.25.0"
  - "py-sympy"
  - "py-pytest"
  - "petsc+hpddm+mumps+hwloc+ptscotch+suite-sparse+hdf5+hypre"
  - "slepc+hpddm"

  # Keep the generated view outside the repository checkout so activated CMake
  # builds do not export include directories that are prefixed by the source
  # tree. Set SPACK_USER_CACHE_PATH to place this on fast local storage.
  view: $user_cache_path/views/feelpp/cpu-openmpi

  concretizer:
    unify: when_possible

  repos:
    # Repository-owned local overrides to unblock shared environment installs.
    feelpp: $env/../../../repo/spack_repo/feelpp
