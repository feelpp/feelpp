software:
  name: Feel++
  short_name: feelpp
  description: Feel++ is an open-source C++ framework for continuous and discontinuous
    Galerkin methods, reduced basis methods, and parallel PDE simulation with multiphysics
    toolboxes and Python bindings.
  homepage: https://docs.feelpp.org
  source_paths:
  - README.adoc
  - codemeta.json
  - CITATION.cff
