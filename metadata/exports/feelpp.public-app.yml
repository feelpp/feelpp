public_license:
  expressions:
  - LGPL-3.0-or-later
  - GPL-3.0-or-later
  files:
  - path: LICENSE
    description: Repository root license text for GNU LGPL version 3.
  - path: COPYING.adoc
    description: Public licensing overview for the Feel++ libraries, applications,
      examples, tests, and benchmarks.
  - path: CITATION.cff
    description: Public citation metadata declaring LGPL-3.0-or-later.
  - path: codemeta.json
    description: Public CodeMeta metadata listing LGPL-3.0-only and GPL-3.0-only SPDX
      URLs.
  notes: The public repository contains both library and application/example/test
    materials; this metadata records the public license signals already present in
    repository files and does not make private legal determinations.
architecture:
  overview: Feel++ is organized around a C++ core library, Python bindings, multiphysics
    toolboxes, model order reduction components, operational packaging tooling, and
    tests/documentation for public releases.
  components:
  - name: C++ core
    paths:
    - feelpp/feel
    description: Shared C++ library and core framework components.
  - name: Python bindings
    paths:
    - feelpp/python
    - toolboxes/python
    - mor/python
    description: Python modules and tests built from the Feel++ core, toolbox, and
      model order reduction bindings.
  - name: Toolboxes
    paths:
    - toolboxes
    description: Public multiphysics application toolboxes.
  - name: Model order reduction
    paths:
    - mor
    description: Public model order reduction components.
  - name: Operational tooling
    paths:
    - ops
    - packaging
    description: Public Python tooling and packaging metadata for release operations.
