directory=qs_darcy_hybrid/quarter-turn3D

rho=1
sc.condense=true

ksp-type=preonly
pc-type=lu

[gmsh]
filename=$cfgdir/quarter-turn3D.geo
hsize=0.1

[functions]
f={0,0,0}:x:y:z
g=0
jn=0

[solution]
V=5*2/pi*atan2(y,x):x:y:z
j={10/pi*y/(x*x+y*y),-10/pi*x/(x*x+y*y),0}:x:y:z

[exporter]
format=ensightgold
geometry=static
