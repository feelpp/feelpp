directory=qs_maxwell/sphere

family=ned1
order=1
geometry.order=2
solution=sin
mass=1

ksp-type=preonly
pc-type=lu

[gmsh]
hsize=0.5

# Equal semiaxes give the unit ball centered at the origin.
[gmsh.domain]
shape=ellipsoid
xmin=-1
xmax=1
ymin=-1
ymax=1
zmin=-1
zmax=1

[exporter]
format=ensightgold
geometry=static
