directory=qs_elasticity/cantilever-point-moment-3d
E=1e6
nu=0.3

[gmsh]
filename=$cfgdir/cantilever_point_moment_3d.geo

[functions]
g={0,0,0}
f={0,0,0}

[point-moment]
markers=tip
expr={0,0,20}
quantity=total

[cantilever]
check=true
tip-marker=tip
component=1
length=10
height=1
thickness=1
tip-force=0
tip-moment=20
tolerance.relative=0.2
tolerance.absolute=1e-12

[exporter]
format=ensightgold
geometry=static
