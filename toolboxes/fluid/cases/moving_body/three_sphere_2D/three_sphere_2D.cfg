#directory=toolboxes/fluid/moving_body/three_sphere_2D/
directory=toolboxes/fluid/moving_body/three_sphere_2D/ringV2

case.dimension=2

[fluid]
exporter.use-static-mesh=0
filename=$cfgdir/three_sphere_2D.json
#mesh.filename=$cfgdir/three_sphere_2D.geo
#gmsh.hsize=3
#solver=Oseen #Oseen,Picard,Newton
ksp-monitor=true
pc-type=lu
ksp-type=preonly
#reuse-prec=1
ksp-maxit-reuse=20
snes-monitor=true
snes-maxit=100
define-pressure-cst=true
#define-pressure-cst.method=lagrange-multiplier#algebraic
verbose_solvertimer=1

#body.articulation.method=p-matrix

[fluid.alemesh]
pc-type=lu
ksp-type=preonly
#type=winslow #harmonic#winslow
#use-adaptive-penalisation=true
verbose=1
[fluid.bdf]
order=2

[ts]
time-step=0.1#0.2#0.1#0.05#0.1#23
time-final=500#20.1
#restart=true
restart.at-last-save=true
time-initial=-0.1#0#-0.1
save.freq=50

[exporter]
freq=40
