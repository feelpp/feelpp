directory=toolboxes/fluid/TurekHron/cfd2_turbulence_liquid_lead/P1P1G1

case.dimension=2
case.discretization=P1P1G1

[fluid]
filename=$cfgdir/cfd2_turbulence_liquid_lead.json

solver=Picard
time-stepping=Theta

linearsystem-cst-update=false
jacobian-linear-update=false

snes-monitor=true
snes-converged-reason=
snes-line-search-type=l2
snes-rtol=1e-4
error-if-solver-not-converged=0

ksp-type=preonly
pc-type=lu

stabilization-gls=1
stabilization-gls.type=supg

distance-to-wall.enabled=1
distance-to-wall.markers=wall1
distance-to-wall.markers=wall2

use-semi-implicit-turbulence-coupling=1
solver-inner-turbulence.nit=1
pseudo-transient-continuation=1

[fluid.turbulence]
solver=Picard
ksp-type=preonly
pc-type=lu
snes-monitor=1
snes-converged-reason=
snes-maxit=25
snes-rtol=1e-5
error-if-solver-not-converged=0

[fluid.turbulence.fluid_turbulence_k]
stabilization=1
stabilization.type=supg
stabilization.do-assembly-with-grad-diffusion-coeff=0

[fluid.turbulence.fluid_turbulence_epsilon]
stabilization=1
stabilization.type=supg
stabilization.do-assembly-with-grad-diffusion-coeff=0
stabilization.gls.shock-capturing=0

[fluid.bdf]
order=2

[ts]
time-step=0.001
time-final=2
restart.at-last-save=true
save.freq=10
