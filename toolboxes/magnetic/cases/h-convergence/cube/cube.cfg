
directory=toolboxes/magnetic/h-convergence/cube

case.dimension=3
#case.discretization=Pchv1
case.mode=h-convergence

[magnetic]
filename=$cfgdir/cube.json

null-space.method=none #saddle-point #regularized-formulation

verbose_solvertimer=1
#verbose=1
#pc-type=lu#gamg
#ksp-type=preonly
snes-monitor=1
ksp-monitor=1
ksp-converged-reason=

preconditioner.attach-ams=1
pc-type=ams
pc-view=1
#ksp-type=minres
#ksp-monitor=1
#ksp-atol=1e-9
#ksp-rtol=1e-10
#ksp-verbose=1
#ksp-view=1


[case.mode.h-convergence]
hsize=0.2
hsize=0.1
hsize=0.05

measures=Norm_error-evaluated_L2-error
