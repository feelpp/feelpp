[gmsh]
structured=1
#filename=feel.geo
#filename=feel3d.geo

[gmsh.domain]
shape=hypercube
convex=hypercube

[case]
dim=2
order=1

[functions]
mu=10
nu=mu
#g=x+y
g=sin(pi*x)*cos(pi*y)
#g=sin(pi*x)*cos(pi*y)*cos(pi*z)

[on]
type=elimination
verbose=1

[exporter]
format=ensight
geometry=0

[exporter.ensightgold]
use-sos=true
