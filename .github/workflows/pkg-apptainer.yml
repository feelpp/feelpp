name: Feelpp PKG Apptainer
run-name: "PKG Apptainer Feel++ [ ${{ inputs.flavor }}/${{ inputs.dist }} ]"
on:
    workflow_dispatch:
      inputs:
        flavor:
          description: 'Flavor to build'
          required: true
          default: 'ubuntu'
          type: choice
          options:
          - 'ubuntu'
          - 'debian'
        dist:
          description: 'Distribution to build'
          required: true
          default: 'noble'
          type: choice
          options:
          - 'resolute'
          - 'trixie'
          - 'noble'
          - 'bullseye'
          - 'bookworm'
          - 'testing'
          - 'sid'
        version:
          description: 'Version of Feel++ packages'
          required: false
          type: string
          default: ''
        apptainer:
          description: 'Build apptainer image'
          required: false
          default: 'latest'
          type: choice
          options:
          - 'latest'
          - 'false'
        docker:
          description: 'docker image'
          required: false
          type: string
          default: 'ghcr.io/feelpp/feelpp'
        docker-dev:
          description: 'docker dev image'
          required: false
          type: string
          default: 'ghcr.io/feelpp/feelpp-dev'
        parallel:
          description: 'Number of parallel jobs'
          required: false
          default: "20"
          type: string
        skip:
          description: 'Skip build'
          required: false
          default: ""
          type: string
        enable-feelpp:
          description: 'Enable feelpp image build'
          required: false
          default: true
          type: boolean
        enable-feelpp-dev:
          description: 'Enable feelpp-dev image build'
          required: false
          default: true
          type: boolean
    workflow_call:
        inputs:
            flavor:
                description: 'Flavor of the distribution'
                required: true
                type: string
                default: "ubuntu"
            dist:
                description: 'Name of the distribution'
                required: true
                type: string
                default: "noble"
            version:
                description: 'Version of Feel++ packages'
                required: true
                type: string
            parallel:
                description: 'Number of parallel jobs'
                required: false
                type: string
                default: "20"
            docker:
                description: 'docker image'
                required: false
                type: string
                default: 'ghcr.io/feelpp/feelpp'
            docker-dev:
                description: 'docker dev image'
                required: false
                type: string
                default: 'ghcr.io/feelpp/feelpp-dev'
            apptainer:
                description: 'Build apptainer image'
                required: false
                type: string
                default: "latest"
            skip:
                description: 'Skip apptainer build'
                required: false
                type: string
                default: ""
            continue-on-error:
                description: 'Continue on error'
                required: false
                type: string
                default: "false"
            enable-feelpp:
                description: 'Enable feelpp image build'
                required: false
                type: boolean
                default: true
            enable-feelpp-dev:
                description: 'Enable feelpp-dev image build'
                required: false
                type: boolean
                default: true

jobs:
  version:
    uses: ./.github/workflows/version.yml
    with:
        continue-on-error: "false"
    secrets: inherit

  apptainer-feelpp:
    if: ${{ !contains( inputs.skip, 'skip apptainer' ) && inputs.apptainer != 'false' && inputs.enable-feelpp }}
    runs-on: self-apptainer
    needs: version
    name: Build and Push feelpp apptainer image
    continue-on-error: ${{ inputs.continue-on-error == 'true' }}
    env:
        version: ${{ inputs.version || needs.version.outputs.version }}
        docker: "${{ inputs.docker }}:${{ inputs.dist }}-v${{ inputs.version || needs.version.outputs.version }}"
        sif: "${{ inputs.docker }}:${{ inputs.dist }}-v${{ inputs.version || needs.version.outputs.version }}-sif"
        FEELPP_PKG_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-feelpp-${{ inputs.flavor }}-${{ inputs.dist }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: ops/pyproject.toml
      - name: Resolve image workspace
        shell: bash
        run: |
          runner_temp="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          job_root="${runner_temp}/feelpp-pkg/${FEELPP_PKG_JOB_ID}"
          mkdir -p "${job_root}"
          echo "FEELPP_PKG_JOB_ROOT=${job_root}" >> "${GITHUB_ENV}"
      - name: Install feelpp-pkg
        shell: bash
        run: |
          uv pip install --system -e ./ops
      - name: Resolve apptainer binary
        id: apptainer_bin
        shell: bash
        run: |
          if [ "${{ inputs.apptainer }}" = "latest" ]; then
            candidate="/opt/apptainer/latest/bin/apptainer"
          else
            candidate="/opt/apptainer/v${{ inputs.apptainer }}/apptainer/bin/apptainer"
          fi
          if [ ! -x "${candidate}" ]; then
            candidate="$(python3 -c 'from feelpp.pkg.apptainer import default_apptainer_binary; print(default_apptainer_binary())')"
          fi
          if [ ! -x "${candidate}" ]; then
            echo "::error::apptainer binary not found: ${candidate}"
            exit 1
          fi
          echo "FEELPP_PKG_APPTAINER_BIN=${candidate}" >> "${GITHUB_ENV}"
          echo "binary=${candidate}" >> "${GITHUB_OUTPUT}"
      - name: Login to GitHub Container Registry
        run: |
          "${{ steps.apptainer_bin.outputs.binary }}" remote login -u "${{ github.repository_owner }}" -p "${{ secrets.CR_PAT }}" oras://ghcr.io
      - name: Publish feelpp apptainer image ${{ env.sif }}
        shell: bash
        run: |
          echo "Using feelpp docker image: ${{ env.docker }}"
          feelpp-pkg image publish apptainer --dist "${{ inputs.dist }}" --flavor "${{ inputs.flavor }}" --source-ref "${{ env.docker }}" --target-ref "${{ env.sif }}"

  apptainer-feelpp-dev:
    if: ${{ !contains( inputs.skip, 'skip apptainer' ) && inputs.apptainer != 'false' && inputs.enable-feelpp-dev }}
    runs-on: self-apptainer
    needs: version
    name: Build and Push feelpp-dev apptainer image
    continue-on-error: ${{ inputs.continue-on-error == 'true' }}
    env:
        version: ${{ inputs.version || needs.version.outputs.version }}
        docker-dev: "${{ inputs.docker-dev }}:${{ inputs.dist }}-v${{ inputs.version || needs.version.outputs.version }}"
        sif-dev: "${{ inputs.docker-dev }}:${{ inputs.dist }}-v${{ inputs.version || needs.version.outputs.version }}-sif"
        FEELPP_PKG_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-feelpp-dev-${{ inputs.flavor }}-${{ inputs.dist }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: ops/pyproject.toml
      - name: Resolve image workspace
        shell: bash
        run: |
          runner_temp="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          job_root="${runner_temp}/feelpp-pkg/${FEELPP_PKG_JOB_ID}"
          mkdir -p "${job_root}"
          echo "FEELPP_PKG_JOB_ROOT=${job_root}" >> "${GITHUB_ENV}"
      - name: Install feelpp-pkg
        shell: bash
        run: |
          uv pip install --system -e ./ops
      - name: Resolve apptainer binary
        id: apptainer_bin
        shell: bash
        run: |
          if [ "${{ inputs.apptainer }}" = "latest" ]; then
            candidate="/opt/apptainer/latest/bin/apptainer"
          else
            candidate="/opt/apptainer/v${{ inputs.apptainer }}/apptainer/bin/apptainer"
          fi
          if [ ! -x "${candidate}" ]; then
            candidate="$(python3 -c 'from feelpp.pkg.apptainer import default_apptainer_binary; print(default_apptainer_binary())')"
          fi
          if [ ! -x "${candidate}" ]; then
            echo "::error::apptainer binary not found: ${candidate}"
            exit 1
          fi
          echo "FEELPP_PKG_APPTAINER_BIN=${candidate}" >> "${GITHUB_ENV}"
          echo "binary=${candidate}" >> "${GITHUB_OUTPUT}"
      - name: Login to GitHub Container Registry
        run: |
          "${{ steps.apptainer_bin.outputs.binary }}" remote login -u "${{ github.repository_owner }}" -p "${{ secrets.CR_PAT }}" oras://ghcr.io
      - name: Publish feelpp-dev apptainer image ${{ env.sif-dev }}
        shell: bash
        run: |
          echo "Using feelpp-dev docker image: ${{ env.docker-dev }}"
          feelpp-pkg image publish apptainer --dist "${{ inputs.dist }}" --flavor "${{ inputs.flavor }}" --source-ref "${{ env.docker-dev }}" --target-ref "${{ env.sif-dev }}"

