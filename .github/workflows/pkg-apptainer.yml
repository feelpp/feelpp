name: Feelpp PKG Apptainer
run-name: "PKG Apptainer Feel++ [ ${{ inputs.flavor }}/${{ inputs.dist }} ]"
on:
    workflow_dispatch:
      inputs:
        flavor:
          description: 'Flavor to build'
          required: true
          default: 'ubuntu'
          type: choice
          options:
          - 'ubuntu'
          - 'debian'
        dist:
          description: 'Distribution to build'
          required: true
          default: 'jammy'
          type: choice
          options:
          - 'jammy'
          - 'focal'
          - 'noble'
          - 'bullseye'
          - 'bookworm'
          - 'testing'
          - 'sid'
        version:
          description: 'Version of Feel++ packages'
          required: false
          type: string
          default: ''
        apptainer:
          description: 'Build apptainer image'
          required: false
          default: '1.3.3'
          type: choice
          options:
          - '1.4.0'
          - 'false'
        docker:
          description: 'docker image'
          required: false
          type: string
          default: 'ghcr.io/feelpp/feelpp'
        docker-dev:
          description: 'docker dev image'
          required: false
          type: string
          default: 'ghcr.io/feelpp/feelpp-dev'
        parallel:
          description: 'Number of parallel jobs'
          required: false
          default: "20"
          type: string
        skip:
          description: 'Skip build'
          required: false
          default: ""
          type: string
        enable-feelpp:
          description: 'Enable feelpp image build'
          required: false
          default: true
          type: boolean
        enable-feelpp-dev:
          description: 'Enable feelpp-dev image build'
          required: false
          default: true
          type: boolean
    workflow_call:
        inputs:
            flavor:
                description: 'Flavor of the distribution'
                required: true
                type: string
                default: "ubuntu"
            dist:
                description: 'Name of the distribution'
                required: true
                type: string
                default: "jammy"
            version:
                description: 'Version of Feel++ packages'
                required: true
                type: string
            parallel:
                description: 'Number of parallel jobs'
                required: false
                type: string
                default: "20"
            docker:
                description: 'docker image'
                required: false
                type: string
                default: 'ghcr.io/feelpp/feelpp'
            docker-dev:
                description: 'docker dev image'
                required: false
                type: string
                default: 'ghcr.io/feelpp/feelpp-dev'
            apptainer:
                description: 'Build apptainer image'
                required: false
                type: string
                default: "1.3.5"
            skip:
                description: 'Skip apptainer build'
                required: false
                type: string
                default: ""
            continue-on-error:
                description: 'Continue on error'
                required: false
                type: string
                default: "false"
            enable-feelpp:
                description: 'Enable feelpp image build'
                required: false
                type: boolean
                default: true
            enable-feelpp-dev:
                description: 'Enable feelpp-dev image build'
                required: false
                type: boolean
                default: true

jobs:
  version:
    uses: ./.github/workflows/version.yml
    with:
        continue-on-error: "false"
    secrets: inherit

  apptainer-feelpp:
    if: ${{ !contains( inputs.skip, 'skip apptainer' ) && inputs.apptainer != 'false' && inputs.enable-feelpp }}
    runs-on: self-apptainer
    needs: version
    name: Build and Push feelpp apptainer image
    continue-on-error: ${{ inputs.continue-on-error == 'true' }}
    env:
        version: ${{ inputs.version || needs.version.outputs.version }}
        docker: "${{ inputs.docker }}:v${{ inputs.version || needs.version.outputs.version }}-${{ inputs.dist }}"
        sif: "${{ inputs.docker }}:v${{ inputs.version || needs.version.outputs.version }}-${{ inputs.dist }}-sif"
        apptainer: /opt/apptainer/v${{ inputs.apptainer }}/apptainer/bin/apptainer
    steps:
      -
        name: Login to GitHub Container Registry
        run: |
          ${{ env.apptainer }} remote login  -u ${{ github.repository_owner }} -p ${{ secrets.CR_PAT }} oras://ghcr.io

      -
        name: Get feelpp docker image ${{ env.docker }}
        run: |
          echo "Using feelpp docker image: ${{ env.docker }}"
          ${{ env.apptainer }} pull -F feelpp.sif docker://${{ env.docker }}
          ${{ env.apptainer }} inspect feelpp.sif
          ls -lrt
      -
        name: Push feelpp apptainer image ${{ env.sif }} to ghcr.io
        run: |
          echo "Using feelpp sif: ${{ env.sif }}"
          ${{ env.apptainer }} push feelpp.sif oras://${{ env.sif }}

  apptainer-feelpp-dev:
    if: ${{ !contains( inputs.skip, 'skip apptainer' ) && inputs.apptainer != 'false' && inputs.enable-feelpp-dev }}
    runs-on: self-apptainer
    needs: version
    name: Build and Push feelpp-dev apptainer image
    continue-on-error: ${{ inputs.continue-on-error == 'true' }}
    env:
        version: ${{ inputs.version || needs.version.outputs.version }}
        docker-dev: "${{ inputs.docker-dev }}:v${{ inputs.version || needs.version.outputs.version }}-${{ inputs.dist }}"
        sif-dev: "${{ inputs.docker-dev }}:v${{ inputs.version || needs.version.outputs.version }}-${{ inputs.dist }}-sif"
        apptainer: /opt/apptainer/v${{ inputs.apptainer }}/apptainer/bin/apptainer
    steps:
      -
        name: Login to GitHub Container Registry
        run: |
          ${{ env.apptainer }} remote login  -u ${{ github.repository_owner }} -p ${{ secrets.CR_PAT }} oras://ghcr.io

      -
        name: Get feelpp-dev docker image ${{ env.docker-dev }}
        run: |
          echo "Using feelpp-dev docker image: ${{ env.docker-dev }}"
          ${{ env.apptainer }} pull -F feelpp-dev.sif docker://${{ env.docker-dev }}
          ${{ env.apptainer }} inspect feelpp-dev.sif
          ls -lrt
      -
        name: Push feelpp-dev apptainer image ${{ env.sif-dev }} to ghcr.io
        run: |
          echo "Using feelpp-dev sif: ${{ env.sif-dev }}"
          ${{ env.apptainer }} push feelpp-dev.sif oras://${{ env.sif-dev }}

