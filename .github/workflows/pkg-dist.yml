name: Feelpp PKG Reusable Workflow
on:
    workflow_call:
        inputs:
            dist: 
                required: true
                type: string
                default: "noble"
            flavor: 
                required: true
                type: string 
                default: "ubuntu"
            version:
                required: true
                type: string
            docker:
                required: false
                type: string
                default: "true"
            apptainer:
                required: false
                type: string
                default: "true"
            parallel:
                required: false
                type: string
                default: "20"
            skip:
                required: false
                type: string
                default: ""
            continue-on-error:
                required: false
                type: string
                default: "false"
            feelpp-version:
                required: true
                type: string
            feelpp-main-version:
                required: true
                type: string
            feelpp-extra-version:
                required: true
                type: string
jobs:
    activate:
      runs-on: self-pkg
      steps:
      - name: how
        run: |
          echo "              flavor: ${{ inputs.flavor }}"
          echo "                dist: ${{ inputs.dist }}"
          echo "                skip: ${{ inputs.skip }}"
          echo "            parallel: ${{ inputs.parallel }}"
          echo "              docker: ${{ inputs.docker }}"
          echo "           apptainer: ${{ inputs.apptainer }}"
          echo "             version: ${{ inputs.version }}"
          echo "      feelpp-version: ${{ inputs.feelpp-version }}"
          echo " feelpp-main-version: ${{ inputs.feelpp-main-version }}"
          echo "feelpp-extra-version: ${{ inputs.feelpp-extra-version }}"
        shell: bash
        env:
          DIST: ${{ inputs.dist }}
          FLAVOR: ${{ inputs.flavor }}

    pkg:
        if: ${{ inputs.flavor == 'ubuntu' || inputs.flavor == 'debian' }}
        needs: activate
        runs-on: self-pkg
        continue-on-error: ${{ inputs.continue-on-error == 'true' }}
        timeout-minutes: 600
        env:
            DIST: ${{ inputs.dist }}
            FLAVOR: ${{ inputs.flavor }}
            DEB_BUILD_OPTIONS: "parallel=${{ inputs.parallel }}"
            FEELPP_PKG_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.flavor }}-${{ inputs.dist }}
            FEELPP_PKG_JOB_ROOT: ${{ runner.temp }}/feelpp-pkg/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.flavor }}-${{ inputs.dist }}
            FEELPP_PKG_LOCAL_REPO_DIR: ${{ runner.temp }}/feelpp-pkg/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.flavor }}-${{ inputs.dist }}/local-repo
            FEELPP_PKG_ARTIFACTS_DIR: ${{ runner.temp }}/feelpp-pkg/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.flavor }}-${{ inputs.dist }}/artifacts
            FEELPP_PKG_RESULTS_DIR: ${{ runner.temp }}/feelpp-pkg/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.flavor }}-${{ inputs.dist }}/results
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with: 
            submodules: true
        - name: Resolve docker state root
          shell: bash
          env:
            FEELPP_PKG_DOCKER_STATE_ROOT_BASE: ${{ vars.FEELPP_PKG_DOCKER_STATE_ROOT_BASE }}
          run: |
            if [ -n "${FEELPP_PKG_DOCKER_STATE_ROOT_BASE}" ]; then
              state_root_base="${FEELPP_PKG_DOCKER_STATE_ROOT_BASE}"
            elif [ -d "/nvme0/cemosis" ] && [ -w "/nvme0/cemosis" ]; then
              state_root_base="/nvme0/cemosis/.cache/feelpp-pkg/docker"
            elif [ -n "${XDG_CACHE_HOME:-}" ]; then
              state_root_base="${XDG_CACHE_HOME}/feelpp-pkg/docker"
            elif [ -n "${HOME:-}" ]; then
              state_root_base="${HOME}/.cache/feelpp-pkg/docker"
            else
              state_root_base="${RUNNER_TOOL_CACHE}/feelpp-pkg/docker"
            fi
            state_root="${state_root_base}/${FLAVOR}/${DIST}"
            if ! mkdir -p "${state_root}" 2>/dev/null; then
              state_root="${RUNNER_TOOL_CACHE}/feelpp-pkg/docker/${FLAVOR}/${DIST}"
              mkdir -p "${state_root}"
            fi
            echo "FEELPP_PKG_DOCKER_STATE_ROOT=${state_root}" >> "${GITHUB_ENV}"
        - name: Install feelpp-pkg
          run: |
            python3 -m pip install --no-build-isolation -e packaging
        - name: Prepare local package workspace
          run: |
            rm -rf "${FEELPP_PKG_JOB_ROOT}"
            feelpp-pkg job init --dist "${DIST}" --flavor "${FLAVOR}"
          env:
            DIST: ${{ inputs.dist }}
            FLAVOR: ${{ inputs.flavor }}
        - name: Build package chain
          run: |
            feelpp-pkg build chain --dist "${DIST}" --flavor "${FLAVOR}" --skip-text "${SKIP_TEXT}"
          env:
            SKIP_TEXT: ${{ format( '{0} {1}', github.event.head_commit.message, inputs.skip ) }}

        - name: Upload package artifacts
          if: ${{ !contains( format( '{0} {1}', github.event.head_commit.message, inputs.skip ), 'skip publish' ) }}
          uses: actions/upload-artifact@v4
          with:
            name: feelpp-pkg-${{ inputs.flavor }}-${{ inputs.dist }}
            path: ${{ env.FEELPP_PKG_ARTIFACTS_DIR }}
            if-no-files-found: error
            retention-days: 7

    publish:
      if: ${{ inputs.flavor == 'ubuntu' || inputs.flavor == 'debian' }}
      needs: pkg
      runs-on: self-pkg
      continue-on-error: ${{ inputs.continue-on-error == 'true' }}
      env:
          DIST: ${{ inputs.dist }}
          FLAVOR: ${{ inputs.flavor }}
          FEELPP_PKG_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.flavor }}-${{ inputs.dist }}
          FEELPP_PKG_JOB_ROOT: ${{ runner.temp }}/feelpp-pkg/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.flavor }}-${{ inputs.dist }}
          FEELPP_PKG_PUBLISH_INPUT_DIR: ${{ runner.temp }}/feelpp-pkg/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.flavor }}-${{ inputs.dist }}/publish-input
          FEELPP_PKG_SNAPSHOT_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.flavor }}-${{ inputs.dist }}
      steps:
      - name: Checkout code
        if: ${{ !contains( github.event.head_commit.message, 'skip publish' ) && !contains( inputs.skip, 'skip publish' ) }}
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Resolve docker state root
        if: ${{ !contains( github.event.head_commit.message, 'skip publish' ) && !contains( inputs.skip, 'skip publish' ) }}
        shell: bash
        env:
          FEELPP_PKG_DOCKER_STATE_ROOT_BASE: ${{ vars.FEELPP_PKG_DOCKER_STATE_ROOT_BASE }}
        run: |
          if [ -n "${FEELPP_PKG_DOCKER_STATE_ROOT_BASE}" ]; then
            state_root_base="${FEELPP_PKG_DOCKER_STATE_ROOT_BASE}"
          elif [ -d "/nvme0/cemosis" ] && [ -w "/nvme0/cemosis" ]; then
            state_root_base="/nvme0/cemosis/.cache/feelpp-pkg/docker"
          elif [ -n "${XDG_CACHE_HOME:-}" ]; then
            state_root_base="${XDG_CACHE_HOME}/feelpp-pkg/docker"
          elif [ -n "${HOME:-}" ]; then
            state_root_base="${HOME}/.cache/feelpp-pkg/docker"
          else
            state_root_base="${RUNNER_TOOL_CACHE}/feelpp-pkg/docker"
          fi
          state_root="${state_root_base}/${FLAVOR}/${DIST}"
          if ! mkdir -p "${state_root}" 2>/dev/null; then
            state_root="${RUNNER_TOOL_CACHE}/feelpp-pkg/docker/${FLAVOR}/${DIST}"
          fi
          mkdir -p "${state_root}" "${FEELPP_PKG_PUBLISH_INPUT_DIR}"
          echo "FEELPP_PKG_DOCKER_STATE_ROOT=${state_root}" >> "${GITHUB_ENV}"
      - name: Install feelpp-pkg
        if: ${{ !contains( github.event.head_commit.message, 'skip publish' ) && !contains( inputs.skip, 'skip publish' ) }}
        run: |
          python3 -m pip install --no-build-isolation -e packaging
      - name: Download package artifacts
        if: ${{ !contains( github.event.head_commit.message, 'skip publish' ) && !contains( inputs.skip, 'skip publish' ) }}
        uses: actions/download-artifact@v4
        with:
          name: feelpp-pkg-${{ inputs.flavor }}-${{ inputs.dist }}
          path: ${{ env.FEELPP_PKG_PUBLISH_INPUT_DIR }}
      - name: Publish package repository
        if: ${{ !contains( github.event.head_commit.message, 'skip publish' ) && !contains( inputs.skip, 'skip publish' ) }}
        run: |
          echo "Publishing package repository"
          gpg -K
          feelpp-pkg publish snapshot --dist "${DIST}" --flavor "${FLAVOR}" --input-dir "${FEELPP_PKG_PUBLISH_INPUT_DIR}"
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    pkg-print:
      runs-on: ubuntu-latest
      steps:
        - name: Show
          run: |
            echo "message: ${{ github.event.head_commit.message }}"
            echo "inputs: ${{ inputs.skip }}"
            echo "docker: ${{ inputs.docker }}"
            echo "apptainer: ${{ inputs.apptainer }}"
            echo "skip docker: ${{ contains( github.event.head_commit.message, 'skip docker' ) }}"
            echo "skip apptainer: ${{ contains( github.event.head_commit.message, 'skip apptainer' ) }}"
            echo "skip inputs: ${{ contains( inputs.skip, 'skip docker' ) }}"
            echo "skip: ${{ format( '{0} {1}', github.event.head_commit.message, inputs.skip ) }}"

    pkg-docker:
      if: ${{ (inputs.flavor == 'ubuntu' || inputs.flavor == 'debian') && inputs.docker == 'true' && !contains( format( '{0} {1}', github.event.head_commit.message, inputs.skip ), 'skip publish' ) }}
      needs: publish
      uses: ./.github/workflows/pkg-docker.yml
      with:
        dist: ${{ inputs.dist }}
        flavor: ${{ inputs.flavor }}
        parallel: ${{ inputs.parallel }}
        skip: ${{ format( '{0} {1}', github.event.head_commit.message, inputs.skip ) }}
        version: ${{ inputs.feelpp-version }}
        continue-on-error: ${{ inputs.continue-on-error }}
      secrets: inherit

    pkg-apptainer:
      if: ${{ (inputs.flavor == 'ubuntu' || inputs.flavor == 'debian') && inputs.apptainer == 'true' && !contains( format( '{0} {1}', github.event.head_commit.message, inputs.skip ), 'skip publish' ) }}
      needs: pkg-docker
      uses: ./.github/workflows/pkg-apptainer.yml
      with:
        dist: ${{ inputs.dist }}
        flavor: ${{ inputs.flavor }}
        parallel: ${{ inputs.parallel }}
        docker: ${{ needs.pkg-docker.outputs.image }}
        docker-dev: ${{ needs.pkg-docker.outputs.image-dev }}
        skip: ${{ format( '{0} {1}', github.event.head_commit.message, inputs.skip ) }}
        version: ${{ inputs.feelpp-version }}
        continue-on-error: ${{ inputs.continue-on-error }}
      secrets: inherit
