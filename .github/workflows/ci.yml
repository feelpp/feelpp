name: Feelpp CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [ master, develop ]

jobs:
  plan_ci:
    name: Plan CI matrix
    runs-on: ubuntu-latest
    outputs:
      mode:          ${{ steps.plan.outputs.mode }}
      only_jobs:     ${{ steps.plan.outputs.only_jobs }}
      skip_jobs:     ${{ steps.plan.outputs.skip_jobs }}
      targets_json:  ${{ steps.plan.outputs.targets_json }}
      targets_list:  ${{ steps.plan.outputs.targets_list }}
      enabled_jobs:  ${{ steps.plan.outputs.enabled_jobs }}
    steps:
      - uses: actions/checkout@v4

      # Planner reads PR title/body (for pull_request),
      # or falls back to the latest commit message.
      - uses: feelpp/ci-matrix-planner@main
        id: plan
        with:
          config-path: .github/plan-ci.json
          # lets the action read PR head commit via API when needed
          github-token: ${{ secrets.GITHUB_TOKEN }}

  feelpp:
    name: Build Feelpp (library)
    needs: [plan_ci]
    runs-on: self-docker
    if: |
      needs.plan_ci.result == 'success' &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'feelpp')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - name: Echo plan
        run: |
          echo "Mode: '${{ needs.plan_ci.outputs.mode }}'"
          echo "Targets: ${{ needs.plan_ci.outputs.targets_list }}"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and Test Feelpp
        run: |
          echo "Building Feelpp for branch ${{ github.event.pull_request && github.head_ref || github.ref_name }}"
          feelpp/tools/scripts/buildkite/install-feelpp.sh feelpp
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  testsuite:
    name: Run Testsuite
    needs: [plan_ci, feelpp]
    runs-on: self-docker
    if: |
      needs.plan_ci.result == 'success' &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'testsuite') &&
      needs.feelpp.result == 'success'
    continue-on-error: true
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run Feelpp Testsuite
        run: |
          feelpp/tools/scripts/buildkite/install-feelpp.sh testsuite
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  toolboxes:
    name: Build Toolboxes
    needs: [plan_ci, feelpp]
    runs-on: self-docker
    if: |
      needs.plan_ci.result == 'success' &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'toolboxes') &&
      needs.feelpp.result == 'success'
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Feelpp Toolboxes
        run: |
          feelpp/tools/scripts/buildkite/install-feelpp.sh toolboxes
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  mor:
    name: Build MOR
    needs: [plan_ci, toolboxes]
    runs-on: self-docker
    if: |
      needs.plan_ci.result == 'success' &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'mor') &&
      needs.toolboxes.result == 'success'
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Feelpp MOR
        run: |
          feelpp/tools/scripts/buildkite/install-feelpp.sh mor
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  python:
    name: Build Python bindings
    needs: [plan_ci, mor]
    runs-on: self-docker
    if: |
      needs.plan_ci.result == 'success' &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'python') &&
      needs.mor.result == 'success'
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Feelpp Python
        run: |
          feelpp/tools/scripts/buildkite/install-feelpp.sh feelpp-python
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20