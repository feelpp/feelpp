name: Feel++ CI

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'CI targets or groups from profiles.ci'
        required: false
        default: ''
        type: string
      only:
        description: 'Restrict CI jobs, for example feelpp or feelpp testsuite'
        required: false
        default: ''
        type: string
      skip:
        description: 'Skip CI jobs, for example toolboxes mor'
        required: false
        default: ''
        type: string
      mode:
        description: 'Planner mode override'
        required: false
        default: ''
        type: string
  pull_request:
    branches: ['*']
    paths-ignore:
      - '.github/workflows/build_from_dispatch.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/images.yml'
      - '.github/workflows/manual.yml'
      - '.github/plan-ci.json'
      - '.github/workflows/pkg*.yml'
      - '.github/workflows/ci-ops.yml'
      - '.github/workflows/doxygen.yml'
      - '.github/workflows/scheduled-ci.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/version.yml'
      - 'ops/**'
      - 'packaging/**'
      - '.gitignore'
  push:
    branches: [master, develop]
    paths-ignore:
      - '.github/workflows/build_from_dispatch.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/images.yml'
      - '.github/workflows/manual.yml'
      - '.github/plan-ci.json'
      - '.github/workflows/pkg*.yml'
      - '.github/workflows/ci-ops.yml'
      - '.github/workflows/doxygen.yml'
      - '.github/workflows/scheduled-ci.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/version.yml'
      - 'ops/**'
      - 'packaging/**'
      - '.gitignore'

permissions:
  contents: read
  packages: read

env:
  FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
  FEELPP_CKAN_API_KEY: ${{ secrets.FEELPP_CKAN_API_KEY }}
  FEELPP_CKAN_URL: ${{ secrets.FEELPP_CKAN_URL }}
  FEELPP_CKAN_ORGANIZATION: ${{ secrets.FEELPP_CKAN_ORGANIZATION }}

# CI consumes the repository-owned image chain published by images.yml:
#   ghcr.io/feelpp/feelpp-env:<oci_dist>        for source builds (Feel++, testsuite, full)
#   ghcr.io/feelpp/feelpp:<oci_dist>            for toolboxes builds
#   ghcr.io/feelpp/feelpp-toolboxes:<oci_dist>  for MOR builds

jobs:
  plan_ci:
    name: Plan CI matrix
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.plan.outputs.matrix_json }}
      targets_json: ${{ steps.plan.outputs.targets_json }}
      enabled_jobs_json: ${{ steps.plan.outputs.enabled_jobs_json }}
      enabled_jobs: ${{ steps.plan.outputs.enabled_jobs }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve planner directives
        id: directives
        shell: bash
        env:
          RAW_TARGETS: ${{ inputs.targets }}
          RAW_ONLY: ${{ inputs.only }}
          RAW_SKIP: ${{ inputs.skip }}
          RAW_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          message=""
          if [ -n "${RAW_TARGETS:-}" ]; then
            message="${message}targets=${RAW_TARGETS}"$'\n'
          fi
          if [ -n "${RAW_ONLY:-}" ]; then
            message="${message}only=${RAW_ONLY}"$'\n'
          fi
          if [ -n "${RAW_SKIP:-}" ]; then
            message="${message}skip=${RAW_SKIP}"$'\n'
          fi
          if [ -n "${RAW_MODE:-}" ]; then
            message="${message}mode=${RAW_MODE}"$'\n'
          fi
          {
            echo "message<<EOF"
            printf "%s" "${message}"
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: feelpp/ci-matrix-planner@v1
        id: plan
        with:
          config-path: .github/plan-ci.json
          message-override: ${{ steps.directives.outputs.message }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug planner output
        shell: bash
        run: |
          echo "message_override: <<EOF"
          printf '%s\n' "${{ steps.directives.outputs.message }}"
          echo "EOF"
          echo "matrix_json: ${{ steps.plan.outputs.matrix_json }}"
          echo "targets_json: ${{ steps.plan.outputs.targets_json }}"
          echo "enabled_jobs_json: ${{ steps.plan.outputs.enabled_jobs_json }}"
          echo "enabled_jobs: ${{ steps.plan.outputs.enabled_jobs }}"

  feelpp:
    name: Build/Test Feel++ (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(fromJSON(needs.plan_ci.outputs.enabled_jobs_json), 'feelpp')
    container:
      image: ghcr.io/feelpp/feelpp-env:${{ matrix.oci_dist }}
      credentials:
        username: ${{ secrets.CR_LOGIN }}
        password: ${{ secrets.CR_PAT }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ci.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          clean: true

      - uses: ./.github/actions/git-safe-directory

      - name: Configure Feel++
        run: cmake --preset feelpp

      - name: Build Feel++
        run: cmake --build --preset feelpp -j20

      - name: Test Feel++
        run: ctest --preset feelpp -j4

  testsuite:
    name: Build/Test Testsuite (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(fromJSON(needs.plan_ci.outputs.enabled_jobs_json), 'testsuite')
    container:
      image: ghcr.io/feelpp/feelpp-env:${{ matrix.oci_dist }}
      credentials:
        username: ${{ secrets.CR_LOGIN }}
        password: ${{ secrets.CR_PAT }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ci.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          clean: true

      - uses: ./.github/actions/git-safe-directory

      - name: Configure Testsuite
        run: cmake --preset testsuite

      - name: Build Testsuite
        run: cmake --build --preset testsuite -j20

      - name: Test Testsuite
        run: ctest --preset testsuite -j4

  toolboxes:
    name: Build/Test Toolboxes (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(fromJSON(needs.plan_ci.outputs.enabled_jobs_json), 'toolboxes')
    container:
      image: ghcr.io/feelpp/feelpp:${{ matrix.oci_dist }}
      credentials:
        username: ${{ secrets.CR_LOGIN }}
        password: ${{ secrets.CR_PAT }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ci.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          clean: true

      - uses: ./.github/actions/git-safe-directory

      - name: Configure Toolboxes
        run: cmake --preset toolboxes

      - name: Build Toolboxes
        run: cmake --build --preset toolboxes -j20

      - name: Test Toolboxes
        run: ctest --preset toolboxes -j4

  mor:
    name: Build/Test MOR (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(fromJSON(needs.plan_ci.outputs.enabled_jobs_json), 'mor')
    container:
      image: ghcr.io/feelpp/feelpp-toolboxes:${{ matrix.oci_dist }}
      credentials:
        username: ${{ secrets.CR_LOGIN }}
        password: ${{ secrets.CR_PAT }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ci.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          clean: true

      - uses: ./.github/actions/git-safe-directory

      - name: Configure MOR
        run: cmake --preset mor

      - name: Build MOR
        run: cmake --build --preset mor -j20

      - name: Test MOR
        run: ctest --preset mor -j4

  feelpp-full:
    name: Build/Test Feel++ Full (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(fromJSON(needs.plan_ci.outputs.enabled_jobs_json), 'feelpp-full')
    container:
      image: ghcr.io/feelpp/feelpp-env:${{ matrix.oci_dist }}
      credentials:
        username: ${{ secrets.CR_LOGIN }}
        password: ${{ secrets.CR_PAT }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ci.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          clean: true

      - uses: ./.github/actions/git-safe-directory

      - name: Configure Full Build
        run: cmake --preset default

      - name: Build Full Stack
        run: cmake --build --preset default -j20

      - name: Test Full Stack
        run: ctest --preset default -j4
