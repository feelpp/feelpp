name: Feelpp CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master','develop']

jobs:
  plan_ci:
    runs-on: self-docker
    outputs:
      message:          ${{ steps.plan.outputs.message }}
      targets_json:     ${{ steps.plan.outputs.targets_json }}
      only_jobs:        ${{ steps.plan.outputs.only_jobs }}
      skip_jobs:        ${{ steps.plan.outputs.skip_jobs }}
    steps:
      - name: Checkout (shallow is fine here)
        uses: actions/checkout@v4

      - id: plan
        name: Parse commit/PR message for CI directives
        shell: bash
        run: |
          set -euo pipefail

          # -------- 1) Canonical MESSAGE (works for push or PR) ----------
          if [[ "${{ github.event_name }}" == "push" ]]; then
            MSG="$(git log -1 --pretty=%B || true)"
          else
            PR_TITLE="${{ github.event.pull_request.title || '' }}"
            PR_BODY="${{ github.event.pull_request.body  || '' }}"
            MSG="$(printf "%s\n\n%s" "$PR_TITLE" "$PR_BODY" | sed 's/\r$//')"
            [[ -z "${MSG// /}" ]] && MSG="$(git log -1 --pretty=%B || true)"
          fi

          echo "---- canonical message ----"
          printf "%s\n" "$MSG"
          echo "---------------------------"

          # Safe multi-line output block (unique delimiter)
          DELIM="EOF_MSG_$(date +%s)_$RANDOM"
          {
            echo "message<<$DELIM"
            printf '%s\n' "$MSG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          # -------- 2) Defaults & helpers ----------
          DEFAULT_TARGETS=("ubuntu:24.04" "ubuntu:22.04" "debian:13" "debian:12" "fedora:42")

          trim() { sed -E 's/^[[:space:]]+|[[:space:]]+$//g'; }
          csv_to_array() { echo "$1" | tr ',;|' '\n' | tr -s '\n' | sed '/^$/d'; }

          # -------- 3) Parse directives ----------
          get_val() {
            local key="$1"
            echo "$MSG" | grep -iE "(^|[[:space:]])${key}=" | sed -E "s/.*${key}=([^[:space:]].*)/\1/i" | head -n1 | trim
          }

          # Jobs filters (apply to job names)
          VAL_ONLY_JOBS="$(get_val only || true)"
          VAL_SKIP_JOBS="$(get_val skip || true)"

          # Targets filters (apply to OS targets)
          VAL_TARGETS="$(get_val targets || true)"
          VAL_INCLUDE="$(get_val include || true)"
          VAL_EXCLUDE="$(get_val exclude || true)"

          # --- Resolve TARGETS ---
          WORKING=("${DEFAULT_TARGETS[@]}")

          if [[ -n "${VAL_TARGETS:-}" ]]; then
            WORKING=()
            while read -r t; do [[ -n "$t" ]] && WORKING+=("$t"); done < <(csv_to_array "$VAL_TARGETS")
          fi

          if [[ -n "${VAL_INCLUDE:-}" ]]; then
            while read -r t; do
              [[ -z "$t" ]] && continue
              if [[ ! " ${WORKING[*]} " =~ " $t " ]]; then
                WORKING+=("$t")
              fi
            done < <(csv_to_array "$VAL_INCLUDE")
          fi

          if [[ -n "${VAL_EXCLUDE:-}" ]]; then
            TO_DROP=($(csv_to_array "$VAL_EXCLUDE"))
            keep=()
            for x in "${WORKING[@]}"; do
              drop=false
              for r in "${TO_DROP[@]}"; do [[ "$x" == "$r" ]] && drop=true && break; done
              $drop || keep+=("$x")
            done
            WORKING=("${keep[@]}")
          fi

          [[ "${#WORKING[@]}" -eq 0 ]] && WORKING=("${DEFAULT_TARGETS[@]}")

          # Emit JSON array for matrix
          JSON="["
          for i in "${!WORKING[@]}"; do
            [[ $i -gt 0 ]] && JSON+=", "
            JSON+="\"${WORKING[$i]}\""
          done
          JSON+="]"
          echo "targets_json=${JSON}" >> "$GITHUB_OUTPUT"

          # --- Resolve JOB filters (comma lists) ---
          if [[ -n "${VAL_ONLY_JOBS:-}" ]]; then
            ONLY_JOBS="$(csv_to_array "$VAL_ONLY_JOBS" | tr '\n' ',' | sed 's/,$//')"
          else
            ONLY_JOBS=""
          fi
          if [[ -n "${VAL_SKIP_JOBS:-}" ]]; then
            SKIP_JOBS="$(csv_to_array "$VAL_SKIP_JOBS" | tr '\n' ',' | sed 's/,$//')"
          else
            SKIP_JOBS=""
          fi

          echo "only_jobs=${ONLY_JOBS}" >> "$GITHUB_OUTPUT"
          echo "skip_jobs=${SKIP_JOBS}" >> "$GITHUB_OUTPUT"

  feelpp:
    needs: [plan_ci]
    runs-on: self-docker
    if: |
      (needs.plan_ci.outputs.only_jobs == '' || contains(needs.plan_ci.outputs.only_jobs, 'feelpp')) &&
      !contains(needs.plan_ci.outputs.skip_jobs, 'feelpp')
    continue-on-error: ${{ matrix.continue-on-error }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
      - name: Workaround checkout Needed single revision issue
        run: git submodule foreach 'git rev-parse HEAD > /dev/null 2>&1 || rm -rf "$PWD"'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and Test Feelpp
        run: |
          echo "Building Feelpp for branch ${{ env.BRANCH }}"
          feelpp/tools/scripts/buildkite/install-feelpp.sh feelpp
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  testsuite:
    needs: [plan_ci, feelpp]
    runs-on: self-docker
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.plan_ci.outputs.only_jobs == '' || contains(needs.plan_ci.outputs.only_jobs, 'testsuite')) &&
      !contains(needs.plan_ci.outputs.skip_jobs, 'testsuite')
    continue-on-error: true
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run Feelpp Testsuite
        run: feelpp/tools/scripts/buildkite/install-feelpp.sh testsuite
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  toolboxes:
    needs: [plan_ci, feelpp]
    runs-on: self-docker
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.plan_ci.outputs.only_jobs == '' || contains(needs.plan_ci.outputs.only_jobs, 'toolboxes')) &&
      !contains(needs.plan_ci.outputs.skip_jobs, 'toolboxes')
    continue-on-error: false
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Feelpp Toolboxes
        run: feelpp/tools/scripts/buildkite/install-feelpp.sh toolboxes
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  mor:
    needs: [plan_ci, toolboxes]
    runs-on: self-docker
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.plan_ci.outputs.only_jobs == '' || contains(needs.plan_ci.outputs.only_jobs, 'mor')) &&
      !contains(needs.plan_ci.outputs.skip_jobs, 'mor')
    continue-on-error: false
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Feelpp MOR
        run: feelpp/tools/scripts/buildkite/install-feelpp.sh mor
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  python:
    needs: [plan_ci, feelpp, toolboxes, mor]
    runs-on: self-docker
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.plan_ci.outputs.only_jobs == '' || contains(needs.plan_ci.outputs.only_jobs, 'python')) &&
      !contains(needs.plan_ci.outputs.skip_jobs, 'python')
    continue-on-error: false
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Feelpp Python
        run: feelpp/tools/scripts/buildkite/install-feelpp.sh feelpp-python
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20