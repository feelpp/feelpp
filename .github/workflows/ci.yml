name: Feel++ CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [master, develop]

env:
  REGISTRY: ghcr.io/feelpp
  FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
  FEELPP_CKAN_API_KEY: ${{ secrets.FEELPP_CKAN_API_KEY }}
  FEELPP_CKAN_URL: ${{ secrets.FEELPP_CKAN_URL }}
  FEELPP_CKAN_ORGANIZATION: ${{ secrets.FEELPP_CKAN_ORGANIZATION }}

# Image naming:
#   Dev images (for CI):     ghcr.io/feelpp/feelpp:ubuntu-24.04-dev
#   Runtime images (users):  ghcr.io/feelpp/feelpp:ubuntu-24.04

jobs:
  plan_ci:
    name: Plan CI matrix
    runs-on: ubuntu-latest
    outputs:
      targets_json: ${{ steps.plan.outputs.targets_json }}
      enabled_jobs: ${{ steps.plan.outputs.enabled_jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: feelpp/ci-matrix-planner@v1.11
        id: plan
        with:
          config-path: .github/plan-ci.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

  feelpp:
    name: Build Feel++ (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(needs.plan_ci.outputs.enabled_jobs, 'feelpp')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - name: Clone docker repo
        run: git clone --depth=1 https://github.com/feelpp/docker.git

      - name: Set DIST from TARGET
        id: dist
        run: |
          # Convert debian:13 -> debian-13, ubuntu:24.04 -> ubuntu-24.04
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push Feel++ (dev)
        working-directory: docker
        run: docker buildx bake feelpp --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Build and push runtime image
        if: github.event_name == 'push'
        working-directory: docker
        run: docker buildx bake feelpp-runtime --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

  toolboxes:
    name: Build Toolboxes (${{ matrix.target }})
    needs: [plan_ci, feelpp]
    runs-on: self-docker
    if: |
      always() &&
      (needs.feelpp.result == 'success' || needs.feelpp.result == 'skipped') &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'toolboxes')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - name: Clone docker repo
        run: git clone --depth=1 https://github.com/feelpp/docker.git

      - name: Set DIST from TARGET
        id: dist
        run: |
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push Toolboxes (dev)
        working-directory: docker
        run: docker buildx bake toolboxes --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Build and push runtime image
        if: github.event_name == 'push'
        working-directory: docker
        run: docker buildx bake toolboxes-runtime --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

  mor:
    name: Build MOR (${{ matrix.target }})
    needs: [plan_ci, toolboxes]
    runs-on: self-docker
    if: |
      always() &&
      (needs.toolboxes.result == 'success' || needs.toolboxes.result == 'skipped') &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'mor')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - name: Clone docker repo
        run: git clone --depth=1 https://github.com/feelpp/docker.git

      - name: Set DIST from TARGET
        id: dist
        run: |
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push MOR (dev)
        working-directory: docker
        run: docker buildx bake mor --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Build and push runtime image
        if: github.event_name == 'push'
        working-directory: docker
        run: docker buildx bake mor-runtime --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

  python:
    name: Build Python (${{ matrix.target }})
    needs: [plan_ci, mor]
    runs-on: self-docker
    if: |
      always() &&
      (needs.mor.result == 'success' || needs.mor.result == 'skipped') &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'python')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - name: Clone docker repo
        run: git clone --depth=1 https://github.com/feelpp/docker.git

      - name: Set DIST from TARGET
        id: dist
        run: |
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push Python (dev)
        working-directory: docker
        run: docker buildx bake python --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Build and push runtime image
        if: github.event_name == 'push'
        working-directory: docker
        run: docker buildx bake python-runtime --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}