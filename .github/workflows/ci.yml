name: Feel++ CI

on:
  workflow_dispatch:
  pull_request:
    branches: ['*']
    paths-ignore:
      - '.github/workflows/build_from_dispatch.yml'
      - '.github/workflows/manual.yml'
      - '.github/workflows/pkg*.yml'
      - '.github/workflows/ci-ops.yml'
      - '.github/workflows/doxygen.yml'
      - '.github/workflows/scheduled-ci.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/version.yml'
      - 'ops/**'
      - 'packaging/**'
      - '.gitignore'
  push:
    branches: [master, develop]
    paths-ignore:
      - '.github/workflows/build_from_dispatch.yml'
      - '.github/workflows/manual.yml'
      - '.github/workflows/pkg*.yml'
      - '.github/workflows/ci-ops.yml'
      - '.github/workflows/doxygen.yml'
      - '.github/workflows/scheduled-ci.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/version.yml'
      - 'ops/**'
      - 'packaging/**'
      - '.gitignore'


env:
  REGISTRY: ghcr.io/feelpp
  FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
  FEELPP_CKAN_API_KEY: ${{ secrets.FEELPP_CKAN_API_KEY }}
  FEELPP_CKAN_URL: ${{ secrets.FEELPP_CKAN_URL }}
  FEELPP_CKAN_ORGANIZATION: ${{ secrets.FEELPP_CKAN_ORGANIZATION }}

# Image naming:
#   Dev images (for CI):     ghcr.io/feelpp/feelpp:ubuntu-24.04-dev
#   Runtime images (users):  ghcr.io/feelpp/feelpp:ubuntu-24.04

jobs:
  plan_ci:
    name: Plan CI matrix
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.normalize.outputs.matrix_json }}
      targets_json: ${{ steps.plan.outputs.targets_json }}
      enabled_jobs_json: ${{ steps.normalize.outputs.enabled_jobs_json }}
      enabled_jobs: ${{ steps.plan.outputs.enabled_jobs }}
    steps:
      - uses: actions/checkout@v5
      - uses: feelpp/ci-matrix-planner@v1.13.0
        id: plan
        with:
          config-path: .github/plan-ci.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize planner outputs
        id: normalize
        shell: bash
        env:
          MATRIX_JSON_RAW: ${{ steps.plan.outputs.matrix_json }}
          TARGETS_JSON_RAW: ${{ steps.plan.outputs.targets_json }}
          ENABLED_JOBS_JSON_RAW: ${{ steps.plan.outputs.enabled_jobs_json }}
          ENABLED_JOBS_RAW: ${{ steps.plan.outputs.enabled_jobs }}
        run: |
          set -euo pipefail

          if [ -n "${MATRIX_JSON_RAW}" ]; then
            echo "matrix_json=${MATRIX_JSON_RAW}" >> "${GITHUB_OUTPUT}"
          else
            echo "matrix_json={\"target\":${TARGETS_JSON_RAW:-[]}}" >> "${GITHUB_OUTPUT}"
          fi

          if [ -n "${ENABLED_JOBS_JSON_RAW}" ]; then
            echo "enabled_jobs_json=${ENABLED_JOBS_JSON_RAW}" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled_jobs_json=$(jq -Rn --arg jobs "${ENABLED_JOBS_RAW}" '$jobs | split(" ") | map(select(length > 0))')" >> "${GITHUB_OUTPUT}"
          fi
      - name: Debug planner output
        run: |
          echo "matrix_json: ${{ steps.normalize.outputs.matrix_json }}"
          echo "targets_json: ${{ steps.plan.outputs.targets_json }}"
          echo "enabled_jobs_json: ${{ steps.normalize.outputs.enabled_jobs_json }}"
          echo "enabled_jobs: ${{ steps.plan.outputs.enabled_jobs }}"

  feelpp:
    name: Build Feel++ (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(fromJSON(needs.plan_ci.outputs.enabled_jobs_json), 'feelpp')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ci.outputs.matrix_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Clone or update docker repo
        run: |
          if [ -d docker ]; then
            cd docker && git pull --ff-only
          else
            git clone --depth=1 https://github.com/feelpp/docker.git
          fi

      - name: Set DIST from TARGET
        id: dist
        run: |
          # Convert debian:13 -> debian-13, ubuntu:24.04 -> ubuntu-24.04
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push Feel++ runtime
        uses: ./.github/actions/docker-bake
        with:
          bake-target: feelpp-runtime
          matrix-target: ${{ matrix.target }}
          raw-branch: ${{ github.head_ref || github.ref_name }}
          cr-login: ${{ secrets.CR_LOGIN }}
          cr-pat: ${{ secrets.CR_PAT }}

  toolboxes:
    name: Build Toolboxes (${{ matrix.target }})
    needs: [plan_ci, feelpp]
    runs-on: self-docker
    if: |
      always() &&
      (needs.feelpp.result == 'success' || needs.feelpp.result == 'skipped') &&
      contains(fromJSON(needs.plan_ci.outputs.enabled_jobs_json), 'toolboxes')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ci.outputs.matrix_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Clone or update docker repo
        run: |
          if [ -d docker ]; then
            cd docker && git pull --ff-only
          else
            git clone --depth=1 https://github.com/feelpp/docker.git
          fi

      - name: Set DIST from TARGET
        id: dist
        run: |
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push Toolboxes runtime
        uses: ./.github/actions/docker-bake
        with:
          bake-target: toolboxes-runtime
          matrix-target: ${{ matrix.target }}
          raw-branch: ${{ github.head_ref || github.ref_name }}
          cr-login: ${{ secrets.CR_LOGIN }}
          cr-pat: ${{ secrets.CR_PAT }}

  mor:
    name: Build MOR (${{ matrix.target }})
    needs: [plan_ci, toolboxes]
    runs-on: self-docker
    if: |
      always() &&
      (needs.toolboxes.result == 'success' || needs.toolboxes.result == 'skipped') &&
      contains(fromJSON(needs.plan_ci.outputs.enabled_jobs_json), 'mor')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ci.outputs.matrix_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Clone or update docker repo
        run: |
          if [ -d docker ]; then
            cd docker && git pull --ff-only
          else
            git clone --depth=1 https://github.com/feelpp/docker.git
          fi

      - name: Set DIST from TARGET
        id: dist
        run: |
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push MOR runtime
        uses: ./.github/actions/docker-bake
        with:
          bake-target: mor-runtime
          matrix-target: ${{ matrix.target }}
          raw-branch: ${{ github.head_ref || github.ref_name }}
          cr-login: ${{ secrets.CR_LOGIN }}
          cr-pat: ${{ secrets.CR_PAT }}

  # =============================================================================
  # Full Build Mode - Build entire Feel++ stack in a single image
  # =============================================================================
  # Alternative to component builds - uses preset 'default' to build everything
  # Image naming: ghcr.io/feelpp/feelpp:ubuntu-24.04-full-dev
  #
  # Trigger: Use "mode=full" in commit message or PR description
  # Example: git commit -m "Build full stack mode=full"
  # =============================================================================

  feelpp-full:
    name: Build Feel++ Full (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(fromJSON(needs.plan_ci.outputs.enabled_jobs_json), 'feelpp-full')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan_ci.outputs.matrix_json) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and push Feel++ Full runtime
        working-directory: docker
        run: docker buildx bake feelpp-full-runtime --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
