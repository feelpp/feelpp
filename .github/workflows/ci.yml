name: Feelpp CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'develop']

jobs:
  # 1) Plan: unify message (PR or push), parse directives once, expose as outputs
  plan_ci:
    runs-on: self-docker
    outputs:
      message: ${{ steps.collect.outputs.message }}
      targets_json: ${{ steps.collect.outputs.targets_json }}
      skip_components: ${{ steps.collect.outputs.skip_components }}
      skip_feelpp: ${{ steps.collect.outputs.skip_feelpp }}
      skip_tests: ${{ steps.collect.outputs.skip_tests }}
      skip_toolboxes: ${{ steps.collect.outputs.skip_toolboxes }}
      skip_mor: ${{ steps.collect.outputs.skip_mor }}
      skip_python: ${{ steps.collect.outputs.skip_python }}
    steps:
      - name: Checkout (full history for push commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect message + parse directives
        id: collect
        shell: bash
        run: |
          set -euo pipefail

          # -------- 1) Canonical MESSAGE for both event types ----------
          if [[ "${{ github.event_name }}" == "push" ]]; then
            MSG="$(git log -1 --pretty=%B || true)"
          else
            # pull_request
            PR_TITLE="${{ github.event.pull_request.title || '' }}"
            PR_BODY="${{ github.event.pull_request.body  || '' }}"
            MSG="$(printf "%s\n\n%s" "$PR_TITLE" "$PR_BODY" | sed 's/\r$//')"
            if [[ -z "${MSG// /}" ]]; then
              MSG="$(git log -1 --pretty=%B || true)"
            fi
          fi

          echo "---- canonical message ----"
          printf "%s\n" "$MSG"
          echo "---------------------------"

          {
            printf "message<<'EOF'\n"
            printf "%s\n" "$MSG"
            printf "EOF\n"
          } >> "$GITHUB_OUTPUT"

          # -------- 2) Defaults & helpers ----------
          DEFAULT_TARGETS=("ubuntu:24.04" "ubuntu:22.04" "debian:13" "debian:12" "fedora:42")

          trim() { sed -E 's/^[[:space:]]+|[[:space:]]+$//g'; }
          csv_to_array() {
            local csv="$1"
            echo "$csv" | tr ', ' '\n\n' | tr -s '\n' | sed '/^$/d'
          }
          array_contains() {
            local needle="$1"; shift
            for x in "$@"; do [[ "$x" == "$needle" ]] && return 0; done
            return 1
          }
          array_remove_many() {
            local -n _arr="$1"; shift
            local to_remove=("$@")
            local keep=()
            for x in "${_arr[@]}"; do
              local drop=0
              for r in "${to_remove[@]}"; do [[ "$x" == "$r" ]] && drop=1 && break; done
              [[ $drop -eq 0 ]] && keep+=("$x")
            done
            _arr=("${keep[@]}")
          }

          # -------- 3) Parse directives from MESSAGE ----------
          get_val() {
            local key="$1"
            echo "$MSG" | grep -iE "(^|[[:space:]])${key}=" | sed -E "s/.*${key}=([^[:space:]].*)/\1/i" | head -n1 | trim
          }

          VAL_ONLY="$(get_val only || true)"
          VAL_TARGETS="$(get_val targets || true)"
          VAL_INCLUDE="$(get_val include || true)"
          VAL_EXCLUDE="$(get_val exclude || true)"
          VAL_SKIP="$(get_val skip || true)"

          WORKING=("${DEFAULT_TARGETS[@]}")

          if [[ -n "${VAL_ONLY:-}" ]]; then
            WORKING=()
            while read -r t; do [[ -n "$t" ]] && WORKING+=("$t"); done < <(csv_to_array "$VAL_ONLY")
          else
            if [[ -n "${VAL_TARGETS:-}" ]]; then
              WORKING=()
              while read -r t; do [[ -n "$t" ]] && WORKING+=("$t"); done < <(csv_to_array "$VAL_TARGETS")
            fi
            if [[ -n "${VAL_INCLUDE:-}" ]]; then
              while read -r t; do
                [[ -z "$t" ]] && continue
                if ! array_contains "$t" "${WORKING[@]}"; then
                  WORKING+=("$t")
                fi
              done < <(csv_to_array "$VAL_INCLUDE")
            fi
          fi

          if [[ -n "${VAL_EXCLUDE:-}" ]]; then
            TO_DROP=()
            while read -r t; do [[ -n "$t" ]] && TO_DROP+=("$t"); done < <(csv_to_array "$VAL_EXCLUDE")
            array_remove_many WORKING "${TO_DROP[@]}"
          fi

          if [[ "${#WORKING[@]}" -eq 0 ]]; then
            WORKING=("${DEFAULT_TARGETS[@]}")
          fi

          JSON="["
          for i in "${!WORKING[@]}"; do
            [[ $i -gt 0 ]] && JSON+=", "
            JSON+="\"${WORKING[$i]}\""
          done
          JSON+="]"

          echo "Resolved targets: ${WORKING[*]}"
          echo "targets_json=${JSON}" >> "$GITHUB_OUTPUT"

          # -------- 4) Skip flags ----------
          lc_msg="$(printf "%s" "$MSG" | tr '[:upper:]' '[:lower:]')"
          has_token() { grep -qiE "(^|[^a-z])$1([^a-z]|$)" <<< "$lc_msg"; }

          SKIP_COMPONENTS=false
          SKIP_FEELPP=false
          SKIP_TESTS=false
          SKIP_TOOLBOXES=false
          SKIP_MOR=false
          SKIP_PYTHON=false

          if [[ -n "${VAL_SKIP:-}" ]]; then
            l="$(echo "$VAL_SKIP" | tr '[:upper:]' '[:lower:]')"
            [[ "$l" == *components* ]] && SKIP_COMPONENTS=true
            [[ "$l" == *feelpp*     ]] && SKIP_FEELPP=true
            [[ "$l" == *tests*      ]] && SKIP_TESTS=true
            [[ "$l" == *toolboxes*  ]] && SKIP_TOOLBOXES=true
            [[ "$l" == *mor*        ]] && SKIP_MOR=true
            [[ "$l" == *python*     ]] && SKIP_PYTHON=true
          fi

          has_token "skip components" && SKIP_COMPONENTS=true
          has_token "skip feelpp"     && SKIP_FEELPP=true
          has_token "skip tests"      && SKIP_TESTS=true
          has_token "skip toolboxes"  && SKIP_TOOLBOXES=true
          has_token "skip mor"        && SKIP_MOR=true
          has_token "skip python"     && SKIP_PYTHON=true

          echo "skip_components=${SKIP_COMPONENTS}" >> "$GITHUB_OUTPUT"
          echo "skip_feelpp=${SKIP_FEELPP}"         >> "$GITHUB_OUTPUT"
          echo "skip_tests=${SKIP_TESTS}"           >> "$GITHUB_OUTPUT"
          echo "skip_toolboxes=${SKIP_TOOLBOXES}"   >> "$GITHUB_OUTPUT"
          echo "skip_mor=${SKIP_MOR}"               >> "$GITHUB_OUTPUT"
          echo "skip_python=${SKIP_PYTHON}"         >> "$GITHUB_OUTPUT"

  # 2) Legacy adapter so your existing conditionals keep working
  check_skip:
    needs: [plan_ci]
    runs-on: self-docker
    outputs:
      check_skip_components: ${{ needs.plan_ci.outputs.skip_components }}
      check_skip_feelpp:     ${{ needs.plan_ci.outputs.skip_feelpp }}
      check_skip_tests:      ${{ needs.plan_ci.outputs.skip_tests }}
      check_skip_toolboxes:  ${{ needs.plan_ci.outputs.skip_toolboxes }}
      check_skip_mor:        ${{ needs.plan_ci.outputs.skip_mor }}
      check_skip_python:     ${{ needs.plan_ci.outputs.skip_python }}
    steps:
      - name: Echo plan summary
        run: |
          echo "Message:"
          printf '%s\n' "${{ needs.plan_ci.outputs.message }}"
          echo
          echo "Targets JSON: ${{ needs.plan_ci.outputs.targets_json }}"
          echo "Skip components: ${{ needs.plan_ci.outputs.skip_components }}"
          echo "Skip feelpp:     ${{ needs.plan_ci.outputs.skip_feelpp }}"
          echo "Skip tests:      ${{ needs.plan_ci.outputs.skip_tests }}"
          echo "Skip toolboxes:  ${{ needs.plan_ci.outputs.skip_toolboxes }}"
          echo "Skip mor:        ${{ needs.plan_ci.outputs.skip_mor }}"
          echo "Skip python:     ${{ needs.plan_ci.outputs.skip_python }}"

  # 3) Build Feelpp (targets are dynamic)
  feelpp:
    needs: [plan_ci, check_skip]
    runs-on: self-docker
    if: |
      needs.check_skip.outputs.check_skip_components == 'false' &&
      needs.check_skip.outputs.check_skip_feelpp == 'false'
    continue-on-error: false
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and Test Feelpp
        run: |
          echo "Building Feelpp for branch ${{ env.BRANCH }} on ${{ matrix.target }}"
          feelpp/tools/scripts/buildkite/install-feelpp.sh feelpp
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  testsuite:
    needs: [plan_ci, check_skip, feelpp]
    runs-on: self-docker
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.check_skip.outputs.check_skip_components == 'false' &&
      needs.check_skip.outputs.check_skip_tests == 'false'
    continue-on-error: true
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run Feelpp Testsuite
        run: |
          feelpp/tools/scripts/buildkite/install-feelpp.sh testsuite
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  toolboxes:
    needs: [plan_ci, check_skip, feelpp]
    runs-on: self-docker
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.check_skip.outputs.check_skip_components == 'false' &&
      needs.check_skip.outputs.check_skip_toolboxes == 'false'
    continue-on-error: false
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Feelpp Toolboxes
        run: |
          feelpp/tools/scripts/buildkite/install-feelpp.sh toolboxes
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  mor:
    needs: [plan_ci, check_skip, toolboxes]
    runs-on: self-docker
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.check_skip.outputs.check_skip_components == 'false' &&
      needs.check_skip.outputs.check_skip_mor == 'false'
    continue-on-error: false
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Feelpp MOR
        run: |
          feelpp/tools/scripts/buildkite/install-feelpp.sh mor
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20

  python:
    needs: [plan_ci, check_skip, feelpp, toolboxes, mor]
    runs-on: self-docker
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.check_skip.outputs.check_skip_components == 'false' &&
      needs.check_skip.outputs.check_skip_python == 'false'
    continue-on-error: false
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Feelpp Python
        run: |
          feelpp/tools/scripts/buildkite/install-feelpp.sh feelpp-python
        env:
          FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ github.event.pull_request && github.head_ref || github.ref_name }}
          CR_PAT: ${{ secrets.CR_PAT }}
          CR_LOGIN: ${{ secrets.CR_LOGIN }}
          JOBS: 20