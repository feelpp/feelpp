name: Feel++ CI

on:
  workflow_dispatch:
  pull_request:
    branches: ['*']
  push:
    branches: [master, develop]

env:
  REGISTRY: ghcr.io/feelpp
  FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
  FEELPP_CKAN_API_KEY: ${{ secrets.FEELPP_CKAN_API_KEY }}
  FEELPP_CKAN_URL: ${{ secrets.FEELPP_CKAN_URL }}
  FEELPP_CKAN_ORGANIZATION: ${{ secrets.FEELPP_CKAN_ORGANIZATION }}

# Image naming:
#   Dev images (for CI):     ghcr.io/feelpp/feelpp:ubuntu-24.04-dev
#   Runtime images (users):  ghcr.io/feelpp/feelpp:ubuntu-24.04

jobs:
  plan_ci:
    name: Plan CI matrix
    runs-on: ubuntu-latest
    outputs:
      targets_json: ${{ steps.plan.outputs.targets_json }}
      enabled_jobs: ${{ steps.plan.outputs.enabled_jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: feelpp/ci-matrix-planner@v1.12
        id: plan
        with:
          config-path: .github/plan-ci.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug planner output
        run: |
          echo "targets_json: ${{ steps.plan.outputs.targets_json }}"
          echo "enabled_jobs: ${{ steps.plan.outputs.enabled_jobs }}"

  feelpp:
    name: Build Feel++ (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(needs.plan_ci.outputs.enabled_jobs, 'feelpp')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone or update docker repo
        run: |
          if [ -d docker ]; then
            cd docker && git pull --ff-only
          else
            git clone --depth=1 https://github.com/feelpp/docker.git
          fi

      - name: Set DIST from TARGET
        id: dist
        run: |
          # Convert debian:13 -> debian-13, ubuntu:24.04 -> ubuntu-24.04
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push Feel++ runtime
        working-directory: docker
        run: docker buildx bake feelpp-runtime --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Run Core Python CI lane
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            ${REGISTRY}/feelpp-env:${{ steps.dist.outputs.dist }} \
            bash -lc '
              set -euo pipefail
              python3 -m pip install --break-system-packages pytest
              JOBS=20 bash scripts/ci/run_python_ci_lane.sh core
            '

  toolboxes:
    name: Build Toolboxes (${{ matrix.target }})
    needs: [plan_ci, feelpp]
    runs-on: self-docker
    if: |
      always() &&
      (needs.feelpp.result == 'success' || needs.feelpp.result == 'skipped') &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'toolboxes')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone or update docker repo
        run: |
          if [ -d docker ]; then
            cd docker && git pull --ff-only
          else
            git clone --depth=1 https://github.com/feelpp/docker.git
          fi

      - name: Set DIST from TARGET
        id: dist
        run: |
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push Toolboxes runtime
        working-directory: docker
        run: docker buildx bake toolboxes-runtime --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Run Toolboxes Python electric lane
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            ${REGISTRY}/feelpp-env:${{ steps.dist.outputs.dist }} \
            bash -lc '
              set -euo pipefail
              python3 -m pip install --break-system-packages pytest
              JOBS=20 bash scripts/ci/run_python_ci_lane.sh electric
            '

      - name: Run Toolboxes Python heat lane
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            ${REGISTRY}/feelpp-env:${{ steps.dist.outputs.dist }} \
            bash -lc '
              set -euo pipefail
              python3 -m pip install --break-system-packages pytest
              JOBS=20 bash scripts/ci/run_python_ci_lane.sh heat
            '

  mor:
    name: Build MOR (${{ matrix.target }})
    needs: [plan_ci, toolboxes]
    runs-on: self-docker
    if: |
      always() &&
      (needs.toolboxes.result == 'success' || needs.toolboxes.result == 'skipped') &&
      contains(needs.plan_ci.outputs.enabled_jobs, 'mor')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone or update docker repo
        run: |
          if [ -d docker ]; then
            cd docker && git pull --ff-only
          else
            git clone --depth=1 https://github.com/feelpp/docker.git
          fi

      - name: Set DIST from TARGET
        id: dist
        run: |
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push MOR runtime
        working-directory: docker
        run: docker buildx bake mor-runtime --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Run MOR Python lane
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            ${REGISTRY}/feelpp-env:${{ steps.dist.outputs.dist }} \
            bash -lc '
              set -euo pipefail
              python3 -m pip install --break-system-packages pytest
              JOBS=20 bash scripts/ci/run_python_ci_lane.sh mor
            '

  # =============================================================================
  # Full Build Mode - Build entire Feel++ stack in a single image
  # =============================================================================
  # Alternative to component builds - uses preset 'default' to build everything
  # Image naming: ghcr.io/feelpp/feelpp:ubuntu-24.04-full-dev
  #
  # Trigger: Use "mode=full" in commit message or PR description
  # Example: git commit -m "Build full stack mode=full"
  # =============================================================================

  feelpp-full:
    name: Build Feel++ Full (${{ matrix.target }})
    needs: [plan_ci]
    runs-on: self-docker
    if: contains(needs.plan_ci.outputs.enabled_jobs, 'feelpp-full')
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan_ci.outputs.targets_json) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - name: Clone or update docker repo
        run: |
          if [ -d docker ]; then
            cd docker && git pull --ff-only
          else
            git clone --depth=1 https://github.com/feelpp/docker.git
          fi

      - name: Set DIST from TARGET
        id: dist
        run: |
          DIST=$(echo "${{ matrix.target }}" | tr ':' '-')
          echo "dist=${DIST}" >> $GITHUB_OUTPUT

      - name: Build and push Feel++ Full runtime
        working-directory: docker
        run: docker buildx bake feelpp-full-runtime --push
        env:
          DIST: ${{ steps.dist.outputs.dist }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
