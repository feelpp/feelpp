name: Packaging PR Validation

on:
  pull_request:
    branches: ['*']
    paths:
      - 'packaging/**'
      - 'ops/**'
      - '.github/workflows/packaging-pr.yml'
  push:
    branches: [master, develop]
    paths:
      - 'packaging/**'
      - 'ops/**'
      - '.github/workflows/packaging-pr.yml'

permissions:
  contents: read

jobs:
  classify:
    name: Classify packaging changes
    runs-on: ubuntu-latest
    outputs:
      structural: ${{ steps.classify.outputs.structural }}
      changed_changelogs: ${{ steps.classify.outputs.changed_changelogs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify diff
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          changed_files = subprocess.check_output(
              ["git", "diff", "--name-only", base_sha, head_sha],
              text=True,
          ).splitlines()

          relevant_prefixes = (
              "packaging/",
              "ops/",
          )
          relevant_exact = {
              ".github/workflows/packaging-pr.yml",
          }
          metadata_patterns = (
              re.compile(r"^packaging/README\.md$"),
              re.compile(r"^packaging/debian/README\.md$"),
              re.compile(r"^packaging/pbuilder/README\.md$"),
              re.compile(r"^packaging/debian/[^/]+/[^/]+/README\.adoc$"),
              re.compile(r"^packaging/debian/[^/]+/[^/]+/debian/README\.(Debian|Sources)$"),
              re.compile(r"^packaging/debian/[^/]+/[^/]+/debian/changelog$"),
              re.compile(r"^ops/README\.md$"),
          )
          changelog_pattern = re.compile(r"^packaging/debian/[^/]+/[^/]+/debian/changelog$")

          structural = False
          changed_changelogs: list[str] = []

          for path in changed_files:
              is_relevant = path.startswith(relevant_prefixes) or path in relevant_exact
              if not is_relevant:
                  continue

              if changelog_pattern.match(path):
                  changed_changelogs.append(path)

              if any(pattern.match(path) for pattern in metadata_patterns):
                  continue

              structural = True

          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"structural={'true' if structural else 'false'}\n")
              fh.write("changed_changelogs<<EOF\n")
              for path in changed_changelogs:
                  fh.write(f"{path}\n")
              fh.write("EOF\n")
          PY

  metadata:
    name: Validate packaging metadata
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v5

      - name: Parse changed Debian changelogs
        shell: bash
        run: |
          set -euo pipefail

          parsed_any=false
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            parsed_any=true
            echo "Validating ${file}"
            dpkg-parsechangelog -l"${file}" >/dev/null
          done <<< "${{ needs.classify.outputs.changed_changelogs }}"

          if [ "${parsed_any}" = false ]; then
            echo "No Debian changelog changes in this diff."
          fi

      - name: Ensure packaging subtree stays source-only
        shell: bash
        run: |
          set -euo pipefail

          if find packaging \( -name '.pytest_cache' -o -name '__pycache__' -o -name '*.egg-info' \) -print -quit | grep -q .; then
            echo "Generated artifacts found under packaging/" >&2
            exit 1
          fi

  structural:
    name: Validate packaging structure
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.structural == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: ops/pyproject.toml

      - name: Install packaging tooling
        shell: bash
        run: uv pip install --system -e 'ops[test]'

      - name: Run ops tests
        shell: bash
        run: python -m pytest -q ops/tests
