name: Feel++ Images

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Image targets or groups from profiles.images'
        required: false
        default: 'env-current'
        type: string
      publish:
        description: 'Push generated OCI images to GHCR'
        required: false
        default: true
        type: boolean
  pull_request:
    branches: ['*']
    paths:
      - '.github/plan-ci.json'
      - '.github/workflows/images.yml'
      - 'ops/**'
      - 'packaging/**'
  push:
    branches: [master, develop]
    paths:
      - '.github/plan-ci.json'
      - '.github/workflows/images.yml'
      - 'ops/**'
      - 'packaging/**'

permissions:
  contents: read
  packages: write

env:
  FEELPP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FEELPP_GIRDER_API_KEY: ${{ secrets.FEELPP_GIRDER_API_KEY }}
  FEELPP_CKAN_API_KEY: ${{ secrets.FEELPP_CKAN_API_KEY }}
  FEELPP_CKAN_URL: ${{ secrets.FEELPP_CKAN_URL }}
  FEELPP_CKAN_ORGANIZATION: ${{ secrets.FEELPP_CKAN_ORGANIZATION }}

jobs:
  plan_images:
    name: Plan image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.plan.outputs.matrix_json }}
      enabled_jobs_json: ${{ steps.plan.outputs.enabled_jobs_json }}
      publish_images: ${{ steps.publish.outputs.publish }}
      directive_message: ${{ steps.directives.outputs.message }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve planner directives
        id: directives
        shell: bash
        env:
          RAW_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          targets="${RAW_TARGETS:-}"
          if [ -z "${targets}" ]; then
            targets="env-current"
          fi
          echo "message=targets=${targets}" >> "${GITHUB_OUTPUT}"

      - name: Resolve publication mode
        id: publish
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RAW_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${RAW_PUBLISH}" = "true" ]; then
              publish=true
            fi
          elif [ "${EVENT_NAME}" = "push" ]; then
            publish=true
          fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

      - name: Compute image matrix
        id: plan
        uses: feelpp/ci-matrix-planner@v1
        with:
          config-path: .github/plan-ci.json
          profile: images
          message-override: ${{ steps.directives.outputs.message }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure matrix is not empty
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.plan.outputs.matrix_json }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          matrix = json.loads(os.environ["MATRIX_JSON"] or '{"include":[]}')
          rows = matrix.get("include", [])
          if not rows:
              raise SystemExit("images planner selected no targets")
          PY

      - name: Debug planner output
        shell: bash
        run: |
          echo "message: ${{ steps.directives.outputs.message }}"
          echo "publish_images: ${{ steps.publish.outputs.publish }}"
          echo "matrix_json: ${{ steps.plan.outputs.matrix_json }}"
          echo "enabled_jobs_json: ${{ steps.plan.outputs.enabled_jobs_json }}"

  images:
    name: Build OCI images (${{ matrix.target }})
    needs: [plan_images]
    runs-on: self-docker
    if: contains(fromJSON(needs.plan_images.outputs.enabled_jobs_json), 'images')
    continue-on-error: ${{ matrix['continue-on-error'] == 'true' }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan_images.outputs.matrix_json) }}
    env:
      CHECKOUT_DIR: src-${{ github.run_id }}-${{ matrix.oci_dist }}
      REPO_ROOT: ${{ github.workspace }}/src-${{ github.run_id }}-${{ matrix.oci_dist }}
      DOCKER_CONFIG: /nvme0/prudhomm/.docker/actions/${{ github.run_id }}-${{ matrix.oci_dist }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ env.CHECKOUT_DIR }}
          clean: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install feelpp-ops
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "${REPO_ROOT}/ops"

      - name: Prepare Docker client config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.33.0
          cache-binary: false

      - name: Login to GitHub Container Registry
        if: needs.plan_images.outputs.publish_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_LOGIN }}
          password: ${{ secrets.CR_PAT }}

      - name: Generate bake inputs
        id: bake
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          JOB_ROOT: ${{ runner.temp }}/feelpp-images/${{ matrix.oci_dist }}
        run: |
          set -euo pipefail
          rm -rf "${JOB_ROOT}"
          mkdir -p "${JOB_ROOT}"
          metadata_file="${JOB_ROOT}/image-metadata.json"

          fpp-pkg image bake \
            --repo-root "${REPO_ROOT}" \
            --job-root "${JOB_ROOT}" \
            --target "${TARGET}" \
            > "${metadata_file}"

          METADATA_FILE="${metadata_file}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["METADATA_FILE"]).read_text(encoding="utf-8"))
          groups = metadata.get("recommended_groups")
          if not isinstance(groups, list) or not groups or not all(isinstance(item, str) and item for item in groups):
              raise SystemExit("image metadata must provide a non-empty recommended_groups list")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"metadata_file={os.environ['METADATA_FILE']}\n")
              fh.write(f"context_dir={metadata['context_dir']}\n")
              fh.write(f"bake_file={metadata['bake_file']}\n")
              fh.write(f"bake_groups={' '.join(groups)}\n")
              fh.write(f"oci_dist={metadata['oci_dist']}\n")
          PY

      - name: Build recommended OCI image targets
        shell: bash
        working-directory: ${{ steps.bake.outputs.context_dir }}
        env:
          BAKE_FILE: ${{ steps.bake.outputs.bake_file }}
          BAKE_GROUPS: ${{ steps.bake.outputs.bake_groups }}
          PUSH_IMAGES: ${{ needs.plan_images.outputs.publish_images }}
        run: |
          set -euo pipefail
          read -r -a bake_groups <<< "${BAKE_GROUPS}"
          cmd=(docker buildx bake -f "${BAKE_FILE}")
          if [ "${PUSH_IMAGES}" = "true" ]; then
            cmd+=(--push)
          fi
          cmd+=("${bake_groups[@]}")
          printf '%q ' "${cmd[@]}"
          echo
          "${cmd[@]}"

      - name: Upload bake context
        if: always() && steps.bake.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ steps.bake.outputs.oci_dist }}
          path: ${{ steps.bake.outputs.context_dir }}
          if-no-files-found: error
