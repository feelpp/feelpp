name: Setup OCI Job
description: Checkout Feel++, install ops tooling, and prepare Docker/buildx state

inputs:
  checkout-dir:
    description: Relative checkout directory inside github.workspace
    required: true
  docker-config:
    description: Docker client config directory
    required: true
  setup-buildx:
    description: Whether to initialize QEMU and buildx
    required: false
    default: "true"
  registry-username:
    description: OCI registry username
    required: false
    default: ""
  registry-password:
    description: OCI registry password
    required: false
    default: ""

outputs:
  repo_root:
    description: Absolute path to the checked out repository
    value: ${{ steps.paths.outputs.repo_root }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        path: ${{ inputs.checkout-dir }}
        clean: false
        submodules: recursive

    - id: paths
      shell: bash
      run: |
        set -euo pipefail
        echo "repo_root=${GITHUB_WORKSPACE}/${{ inputs.checkout-dir }}" >> "${GITHUB_OUTPUT}"

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install feelpp-ops
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install -e "${{ steps.paths.outputs.repo_root }}/ops"

    - name: Prepare Docker client config
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.docker-config }}"

    - name: Set up QEMU
      if: ${{ inputs.setup-buildx == 'true' }}
      uses: docker/setup-qemu-action@v3
      with:
        cache-image: false

    - name: Set up Docker Buildx
      if: ${{ inputs.setup-buildx == 'true' }}
      uses: docker/setup-buildx-action@v3
      with:
        version: v0.33.0
        cache-binary: false

    - name: Login to GitHub Container Registry
      if: ${{ inputs.registry-username != '' && inputs.registry-password != '' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
